<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>С Днём Рождения! ✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0b0b0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    /* Контейнер вертикальной прокрутки со свайпом */
    .feed-container {
      height: 100vh;
      width: 100vw;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .feed-container::-webkit-scrollbar {
      display: none;
    }
    .slide {
      position: relative;
      height: 100vh;
      width: 100vw;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    /* Текстовая подложка снизу */
    .caption-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 30px 20px 40px;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
      pointer-events: none;
    }
    .caption-tag {
      display: inline-block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #ff8cb2;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .caption-text {
      font-size: 18px;
      line-height: 1.4;
      font-weight: 500;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }
    /* Индикатор свайпа вверх */
    .swipe-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(255,255,255,0.6);
      letter-spacing: 1px;
      animation: bounce 1.8s infinite;
      pointer-events: none;
    }
    @keyframes bounce {
      0%, 100% { transform: translate(-50%, 0); opacity: 0.4; }
      50% { transform: translate(-50%, -6px); opacity: 0.9; }
    }
  </style>
</head>
<body>

  <div class="feed-container">

    <!-- ВИДЕО 1 -->
    <div class="slide">
      <video src="video1.mp4" playsinline loop muted autoplay></video>
      <div class="caption-overlay">
        <span class="caption-tag">глава 1</span>
        <p class="caption-text">С днём рождения, любимая подруга! 🤍 Листай дальше ⬇️</p>
      </div>
      <div class="swipe-hint">свайп вверх ⌃</div>
    </div>

    <!-- ВИДЕО 2 -->
    <div class="slide">
      <video src="video2.mp4" playsinline loop muted></video>
      <div class="caption-overlay">
        <span class="caption-tag">воспоминания</span>
        <p class="caption-text">Помнишь, как было круто? Спасибо тебе за каждый момент ✨</p>
      </div>
    </div>

    <!-- ВИДЕО 3 -->
    <div class="slide">
      <video src="video3.mp4" playsinline loop muted></video>
      <div class="caption-overlay">
        <span class="caption-tag">финал</span>
        <p class="caption-text">Оставайся самой счастливой! Люблю тебя сильно-сильно 🎂</p>
      </div>
    </div>

  </div>

  <script>
    // Включаем видео только тогда, когда оно на экране
    const videos = document.querySelectorAll('video');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const video = entry.target;
        if (entry.isIntersecting) {
          video.play().catch(() => {});
        } else {
          video.pause();
        }
      });
    }, { threshold: 0.6 });

    videos.forEach(v => {
      observer.observe(v);
      // Тап по экрану включает/выключает звук
      v.parentElement.addEventListener('click', () => {
        v.muted = !v.muted;
      });
    });
  </script>
</body>
</html>
